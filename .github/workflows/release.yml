name: Release binaries

# タグ(例: v0.1.0)をpushすると、Linux(x86_64-unknown-linux-gnu)・
# Windows(x86_64)向けにビルドし、GitHub Releasesへ添付する。
# RS-Guard等で確立したパターンをそのまま踏襲。sibling path依存は無し
# (Cargo.tomlにpath依存が無いことを確認済み)。

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-linux:
    name: Linux (x86_64-unknown-linux-gnu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: cargo build --release --bin runo-tokyo
      - name: Package
        run: |
          mkdir -p dist
          cp target/release/runo-tokyo dist/runo-tokyo
          cp install.sh dist/install.sh
          tar -czf runo-tokyo-linux-x86_64.tar.gz -C dist runo-tokyo install.sh
      - uses: actions/upload-artifact@v4
        with:
          name: runo-tokyo-linux-x86_64
          path: runo-tokyo-linux-x86_64.tar.gz

  build-windows:
    name: Windows (x86_64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: cargo build --release --bin runo-tokyo
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item target/release/runo-tokyo.exe dist/
          Copy-Item install.ps1 dist/
          Compress-Archive -Path dist/* -DestinationPath runo-tokyo-windows-x86_64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: runo-tokyo-windows-x86_64
          path: runo-tokyo-windows-x86_64.zip

  release:
    name: GitHub Releaseへ添付
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            runo-tokyo-linux-x86_64/runo-tokyo-linux-x86_64.tar.gz
            runo-tokyo-windows-x86_64/runo-tokyo-windows-x86_64.zip
